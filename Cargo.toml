[package]
name = "gpe_pirates_reborn"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
default-run = "pirates-reborn"

[[example]]
name = "pirates_web"
crate-type = ["cdylib"]

[[example]]
name = "navigation_probe"
crate-type = ["cdylib"]

[[bin]]
name = "pirates-reborn"
path = "src/main.rs"

[features]
ui-spike = ["gotoo-pixel-engine/outline-fonts"]

[[example]]
name = "ui_capacity_spike"
required-features = ["ui-spike"]

[[example]]
name = "ui_capacity_spike_web"
crate-type = ["cdylib"]
required-features = ["ui-spike"]

[[example]]
name = "ui_capacity_spike_b"
required-features = ["ui-spike"]

[[example]]
name = "ui_capacity_spike_b_web"
crate-type = ["cdylib"]
required-features = ["ui-spike"]

[dependencies]
gotoo-pixel-engine = { git = "https://github.com/gotoo77/gotoo-pixel-engine.git", rev = "9ea92c068795f4e924b4cb9dd50cbb9ff13d3ef5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.dev.package.gotoo-pixel-engine]
opt-level = 2
